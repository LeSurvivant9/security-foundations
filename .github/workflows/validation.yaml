name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

      # The pre-commit hook scans staged files for developer ergonomics. CI
      # scans the complete checkout, including files that are not staged here.
      - name: Scan repository for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          zricethezav/gitleaks:v8.30.1
          detect --source . --no-git --redact

      # The full stack is not started in CI: DVWA is pinned for ARM64 while
      # GitHub-hosted Ubuntu runners are AMD64. The custom images are portable.
      - name: Build local lab images
        run: docker compose --env-file .env.example build kali gateway
